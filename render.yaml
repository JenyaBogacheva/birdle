# Render Blueprint for Birdle AI Backend
# This file enables one-click deployment to Render
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: birdle-ai-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn services.backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.5
      - key: ANTHROPIC_API_KEY
        sync: false  # User will set this manually
      - key: TAVILY_API_KEY
        sync: false  # User will set this manually
      - key: EBIRD_TOKEN
        sync: false  # User will set this manually
      - key: FRONTEND_BASE_URL
        value: "*"  # Will be updated after frontend deployment
      - key: DEBUG
        value: false
    healthCheckPath: /health
