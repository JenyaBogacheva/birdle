[project]
name = "bird-id-mvp"
version = "0.1.0"
description = "LLM-powered bird identification assistant"
authors = [{ name = "Bird-ID Team" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.52.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0,<0.28.0",
    "python-multipart>=0.0.12",
    "langgraph>=1.2",
    "langchain-anthropic>=1.3",
    "langchain-core>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.4.0",
]
# Offline evaluation harness (evals/). langsmith ships transitively with
# langchain, but the eval scripts import it directly, so pin it explicitly.
evals = [
    "langsmith>=0.8",
]

[tool.uv]
# This is a deployable application, not a library — don't build/install the
# project itself into the environment, just its dependencies.
package = false

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# black (line-length 100) owns formatting and does not split string literals,
# so E501 on long prompt/description strings is noise — let the formatter decide.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["services/backend/tests"]
asyncio_mode = "auto"
# uv runs as a non-package project (tool.uv package = false), so the repo root
# is not installed onto sys.path — add it so `import services...` resolves.
pythonpath = ["."]
